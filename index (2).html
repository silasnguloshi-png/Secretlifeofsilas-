<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="NexaHub — entertainment, learning and shopping in one place.">
  <title>NexaHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="login" class="screen">
    <div class="auth">
      <div class="logo">Nexa<span>Hub</span></div>
      <h1>Everything you enjoy.</h1>
      <p>Entertainment, learning and shopping in one modern hub.</p>
      <input id="email" type="email" placeholder="Email" autocomplete="email">
      <input id="password" type="password" placeholder="Password" autocomplete="current-password">
      <button class="primary" onclick="login()">Sign in</button>
      <button onclick="demo()">Try demo mode</button>
      <small>Demo owner: owner@nexahub.app / owner123</small>
    </div>
  </div>

  <div id="app" class="hidden">
    <header>
      <div class="logo">Nexa<span>Hub</span></div>
      <div class="search"><input id="search" placeholder="Search movies, music, games..." oninput="searchContent(this.value)"></div>
      <div class="actions"><button onclick="openPremium()">⭐ Premium</button><button onclick="logout()">Log out</button></div>
    </header>
    <nav>
      <button class="active" onclick="showSection('home',this)">Home</button>
      <button onclick="showSection('movies',this)">Movies</button>
      <button onclick="showSection('music',this)">Music</button>
      <button onclick="showSection('games',this)">Games</button>
      <button onclick="showSection('learn',this)">School Help</button>
      <button onclick="showSection('shop',this)">Shopping</button>
    </nav>
    <main id="content"></main>
  </div>

  <div id="modal" class="modal hidden"><div class="modal-card"><button class="close" onclick="closeModal()">×</button><div id="modalBody"></div></div></div>
  <div id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
